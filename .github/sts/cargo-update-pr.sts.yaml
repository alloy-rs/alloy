# Only the pinned dependency updater on main may create dependency PRs.
subject:
  - repo:alloy-rs/alloy:ref:refs/heads/main
  - repo:alloy-rs@128098468/alloy@629243152:ref:refs/heads/main

claim_pattern:
  repository_id: '629243152'
  event_name: '(schedule|workflow_dispatch)'
  workflow_ref: 'alloy-rs/alloy/\.github/workflows/dependencies\.yml@refs/heads/main'
  job_workflow_ref: 'tempoxyz/gh-actions/\.github/workflows/cargo-update-pr\.yml@65b6b5834d9ad2b0d4b34d06baff37c143aa59eb'

permissions:
  contents: write
  pull_requests: write
