name: Release

permissions: {}

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "180"

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@ca2b15de1d1f6edd2276736187d7e4c2d898972c # main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          cargo metadata --locked --no-deps --format-version 1 |
            jq -e --arg version "${RELEASE_TAG#v}" '
              [.packages[] | select(.publish != [])] |
              length > 0 and all(.version == $version)
            '
      - name: Verify publishable packages without uploading
        run: cargo publish --workspace --locked --dry-run

  publish:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@ca2b15de1d1f6edd2276736187d7e4c2d898972c # main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release
      - name: Install cargo-release
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@25cce154e7fb10f99361a166468a6c56b9c31aa3 # main
        with:
          tool: cargo-release@1.1.6
          checksum: true
          # cargo-release has upstream binaries but no install-action manifest.
          fallback: cargo-binstall
      - name: Authenticate with crates.io
        uses: tempoxyz/gh-actions/vendor/rust-lang/crates-io-auth-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        id: auth
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # The validate job checks that this detached commit belongs to main.
          cargo release publish --workspace --allow-branch HEAD --no-confirm --execute
