[package]
name = "alloy-ens"
description = "Ethereum Name Service utilities"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lints]
workspace = true

[dependencies]
alloy-contract = { workspace = true, optional = true }
alloy-primitives.workspace = true
alloy-provider = { workspace = true, optional = true }
alloy-sol-types = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
alloy-json-rpc.workspace = true
alloy-provider = { workspace = true, features = ["reqwest", "reqwest-default-tls"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
contract = ["dep:alloy-contract", "dep:thiserror", "dep:alloy-sol-types"]
# Universal Resolver helpers that follow CCIP Read redirects. Enable one of the `reqwest-*-tls`
# features so the default HTTP gateway can reach HTTPS gateways.
provider = ["contract", "dep:alloy-provider", "alloy-provider/ccip-read-http", "dep:async-trait"]
reqwest-default-tls = ["provider", "alloy-provider/reqwest-default-tls"]
reqwest-rustls-tls = ["provider", "alloy-provider/reqwest-rustls-tls"]
reqwest-native-tls = ["provider", "alloy-provider/reqwest-native-tls"]
