[package]
name = "alloy-ens"
description = "Ethereum Name Service utilities"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lints]
workspace = true

[dependencies]
alloy-contract = { workspace = true, optional = true }
alloy-eips = { workspace = true, optional = true }
alloy-primitives.workspace = true
alloy-provider = { workspace = true, optional = true }
alloy-sol-types = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
alloy-provider = { workspace = true, features = ["reqwest", "reqwest-default-tls"] }
alloy-json-rpc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
contract = ["dep:alloy-contract", "dep:thiserror", "dep:alloy-sol-types"]
# Enables Universal Resolver helpers with CCIP Read. Does not select a TLS backend —
# enable one of the `reqwest-*-tls` features (or rely on the caller's choice via the
# `alloy` meta-crate) so the default HTTPS gateway can speak TLS.
provider = [
    "contract",
    "dep:alloy-eips",
    "dep:alloy-provider",
    "alloy-provider/ccip-read-http",
    "dep:async-trait",
]
reqwest-default-tls = ["provider", "alloy-provider/reqwest-default-tls"]
reqwest-rustls-tls = ["provider", "alloy-provider/reqwest-rustls-tls"]
reqwest-native-tls = ["provider", "alloy-provider/reqwest-native-tls"]
